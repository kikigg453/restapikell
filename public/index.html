<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kell REST API</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#080b12;color:#f5f7fb}header{padding:22px 5%;border-bottom:1px solid #202635;display:flex;justify-content:space-between;align-items:center;background:#0b0f18cc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:800}.brand span{color:#7c5cff}.status{padding:8px 12px;border-radius:999px;background:#151b28;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.online .dot{background:#32d583;box-shadow:0 0 12px #32d583}.wrap{max-width:1180px;margin:35px auto;padding:0 18px}.hero{margin-bottom:25px}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:#9aa4b6;margin:0}.card{background:#0e131d;border:1px solid #202838;border-radius:18px;padding:20px;box-shadow:0 18px 50px #0004}.row{display:grid;grid-template-columns:150px 1fr 130px;gap:10px}.select,input,textarea,button{width:100%;background:#0a0e16;border:1px solid #293245;color:#fff;border-radius:11px;padding:13px;font:inherit}.select{appearance:auto}textarea{min-height:170px;resize:vertical;font-family:ui-monospace,monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}button{background:#7357ff;border:0;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}.response{margin-top:16px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.pill{padding:7px 10px;border-radius:9px;background:#151b28;color:#b9c2d0;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;background:#080b12;border:1px solid #202838;border-radius:12px;padding:16px;min-height:180px;overflow:auto}.hidden{display:none}.loading{text-align:center;padding:70px;color:#aab3c2}@media(max-width:750px){.row,.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head><body><header><div class="brand">Kell <span>REST API</span></div><div id="status" class="status"><i class="dot"></i>Checking API...</div></header><main id="app" class="wrap hidden"><section class="hero"><h1>REST API Client</h1><p>Modern HTTP testing powered by HTTPie CLI.</p></section><section class="card"><div class="row"><select id="method" class="select"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" placeholder="https://api.example.com/data"><button onclick="send()">Send →</button></div><div class="grid"><div><h3>Headers</h3><textarea id="headers" placeholder='{"Authorization":"Bearer token","Accept":"application/json"}'></textarea></div><div><h3>JSON Body</h3><textarea id="body" placeholder='{"name":"Kell"}'></textarea></div></div><div class="response"><h3>Response</h3><div id="meta" class="meta"></div><pre id="out">Send a request to see the response.</pre></div></section></main><div id="loading" class="loading">Memeriksa status API dan HTTPie engine...</div><script>const $=x=>document.getElementById(x);async function boot(){try{let r=await fetch('/api/status'),d=await r.json();$('status').className='status '+(d.ok?'online':'');$('status').innerHTML='<i class="dot"></i>'+(d.ok?'API Online':'API Offline');if(d.ok){$('loading').classList.add('hidden');$('app').classList.remove('hidden')}else $('loading').textContent='API engine offline. Railway sedang menyiapkan service.'}catch(e){$('loading').textContent='Gagal mengecek API.'}}async function send(){let h={};try{h=$('headers').value.trim()?JSON.parse($('headers').value):{}}catch(e){return alert('Headers harus JSON valid')}let body;try{body=$('body').value.trim()?JSON.parse($('body').value):undefined}catch(e){return alert('JSON Body tidak valid')} $('out').textContent='Sending...';try{let r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:$('method').value,url:$('url').value.trim(),headers:h,body})}),d=await r.json();$('meta').innerHTML='<span class="pill">Status: '+(d.status||'—')+'</span><span class="pill">Time: '+d.elapsed+'ms</span>';let text=d.body||d.error||'';try{text=JSON.stringify(JSON.parse(text),null,2)}catch{}$('out').textContent=text||d.headers||'No response'}catch(e){$('out').textContent=e.message}}boot();</script></body></html>
